server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite content-hashes every filename under assets/ (a changed file
    # always gets a new filename), so these can be cached indefinitely
    # with zero risk of ever serving stale content under an old name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must NOT be cached the same way - it's what
    # references the current hashed asset filenames, so browsers need to
    # re-fetch it on every visit to pick up a new deploy's references
    # rather than working from a stale cached copy indefinitely.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # No SPA fallback here on purpose: this app has no client-side URL
    # routing (its different views are in-memory React state, never
    # reflected in the URL), so there's no legitimate "deep path" a real
    # visit would ever land on. More importantly, the base path is
    # relative (see the Dockerfile's --base=./ - needed so the same image
    # works whether hosted at a domain's root or behind a reverse proxy
    # at some subpath), and a fallback that served index.html for an
    # arbitrary deep path would break asset resolution there: the browser
    # resolves "./assets/..." against whatever URL is actually in the
    # address bar, not against wherever index.html "really" lives, so a
    # deep fallback URL would resolve assets at the wrong depth. Verified
    # this exact failure mode with a real subpath test before removing
    # the fallback rather than leaving it in as a latent bug.
    location / {
        try_files $uri $uri/ =404;
    }
}
