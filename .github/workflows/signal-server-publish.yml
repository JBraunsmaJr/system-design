name: Build and publish Signal Relay

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run tests

  file-saving-firefox:
    name: File saving suite (Firefox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Run the suite in Firefox
        run: npx tsx scripts/verify-file-saving.ts
        env:
          E2E_BROWSER: firefox

  build-and-publish:
    needs: [test, file-saving-firefox]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image name and date tag
        id: vars
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-relay" >> "$GITHUB_OUTPUT"
          echo "date_tag=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Built and started before anything is published: a successful build
      # is not evidence that the image works, and the relay image once
      # quietly ran a different server from the one the tests exercise.
      - name: Build for a start-up check
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/signaling/Dockerfile
          load: true
          tags: relay-under-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The built image starts and serves
        run: |
          docker run -d --name relay-under-test -p 4444:4444 -e RELAY_TOKEN_SECRET="$(head -c 48 /dev/urandom | base64)" relay-under-test:latest
          for attempt in $(seq 1 30); do
            if health=$(curl -sf http://localhost:4444/health); then
              echo "$health"
              # With a secret set, the published relay must say it requires
              # one - the check that the image honours RELAY_TOKEN_SECRET.
              echo "$health" | grep -q '"authentication":"required"' && exit 0
              echo "The relay started but does not require a token with RELAY_TOKEN_SECRET set."
              exit 1
            fi
            sleep 1
          done
          echo "The image did not serve /health. Its log:"
          docker logs relay-under-test
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # The repository root: the relay's source lives in scripts/ and
          # store/, and is copied in rather than duplicated here.
          context: .
          file: docker/signaling/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.date_tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
