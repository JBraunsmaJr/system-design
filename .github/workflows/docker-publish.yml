name: Build and publish Docker image

# Runs on every push to main (so main always has a corresponding, current
# image) plus workflow_dispatch for a manual re-run - e.g. to publish a
# fresh image under today's date without needing an unrelated commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Required to push to GitHub Container Registry with the default
  # GITHUB_TOKEN - without this the login/push steps fail with a
  # permissions error even on a public repo.
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Docker/OCI image names must be lowercase, but a repository owner
      # or name can contain uppercase letters (this repo's owner does:
      # JBraunsmaJr) - github.repository preserves that casing as-is, so
      # using it directly in an image tag would be rejected by the
      # registry. Verified this exact lowercasing command against this
      # repository's actual name before relying on it here.
      - name: Compute image name and date tag
        id: vars
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "date_tag=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.date_tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
