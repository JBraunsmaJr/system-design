name: Build and publish Workspace Store

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run tests

  # The store's own suites, against the database it runs on in production.
  # The ordinary suite covers them in memory; this is the PostgreSQL half.
  store-postgres:
    name: Store against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: store
          POSTGRES_PASSWORD: store
          POSTGRES_DB: store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://store:store@localhost:5432/store
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Storage contract
        run: npx tsx scripts/verify-store-contract.ts
      - name: HTTP contract
        run: npx tsx scripts/verify-store-http.ts
      - name: Sessions
        run: npx tsx scripts/verify-sessions.ts
      - name: Devices and recovery
        run: npx tsx scripts/verify-store-devices.ts && npx tsx scripts/verify-device-identity.ts
      - name: Retention and legal hold
        run: npx tsx scripts/verify-store-retention.ts
      - name: Workspace index, merge and rotation
        run: |
          npx tsx scripts/verify-store-index.ts
          npx tsx scripts/verify-store-client.ts
          npx tsx scripts/verify-workspace-merge.ts
          npx tsx scripts/verify-workspace-rotation.ts
      - name: The administration guide, performed
        run: npx tsx scripts/verify-admin-docs.ts
      - name: The store as a process
        run: npx tsx scripts/verify-store-startup.ts

  build-and-publish:
    needs: [test, store-postgres]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image name and date tag
        id: vars
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-store" >> "$GITHUB_OUTPUT"
          echo "date_tag=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Built once for this runner, and started, before anything is
      # published. The store image once built cleanly and died on its first
      # run for want of a file it imports: a successful build is not
      # evidence that the image works.
      - name: Build for a start-up check
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/store/Dockerfile
          load: true
          tags: store-under-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The built image starts and serves
        run: |
          docker run -d --name store-under-test -p 8080:8080 \
            -e PUBLIC_URL=http://localhost:8080 \
            -e ALLOW_UNAUTHENTICATED=true \
            store-under-test:latest
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8080/v1/health; then echo; exit 0; fi
            sleep 1
          done
          echo "The image did not serve /v1/health. Its log:"
          docker logs store-under-test
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # The repository root: the store shares the crypto seam in
          # src/crypto with the editor, and copies it in.
          context: .
          file: docker/store/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.date_tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
