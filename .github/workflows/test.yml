name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run tests

  # WS13-R13: the file-saving and session-safety suite in Firefox, which has no
  # File System Access API. The file-backed sections report as skipped there;
  # timed copies, capability messaging, the interrupted-write check and the
  # leave guard run against Firefox's real behaviour.
  file-saving-firefox:
    name: File saving suite (Firefox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Run the suite in Firefox
        run: npx tsx scripts/verify-file-saving.ts
        env:
          E2E_BROWSER: firefox
