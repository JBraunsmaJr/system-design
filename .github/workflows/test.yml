name: Test

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run tests

  file-saving-firefox:
    name: File saving suite (Firefox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Run the suite in Firefox
        run: npx tsx scripts/verify-file-saving.ts
        env:
          E2E_BROWSER: firefox

  store-contract-postgres:
    name: Store contract (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: store
          POSTGRES_USER: store
          POSTGRES_DB: store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the store contract against PostgreSQL
        run: npx tsx scripts/verify-store-contract.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Run the store HTTP contract against PostgreSQL
        run: npx tsx scripts/verify-store-http.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Run device enrollment against PostgreSQL
        run: npx tsx scripts/verify-store-devices.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Run retention and legal hold against PostgreSQL
        run: npx tsx scripts/verify-store-retention.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Run the workspace index against PostgreSQL
        run: npx tsx scripts/verify-store-index.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Run the store client against PostgreSQL
        run: npx tsx scripts/verify-store-client.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: The same protocol, against our own relay
        run: RELAY=ours npx tsx scripts/verify-signaling-server.ts

      - name: Sessions against PostgreSQL
        run: npx tsx scripts/verify-sessions.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Merge concurrent workspace edits against PostgreSQL
        run: npx tsx scripts/verify-workspace-merge.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Rotate a workspace key against PostgreSQL
        run: npx tsx scripts/verify-workspace-rotation.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Start the store as a process against PostgreSQL
        run: npx tsx scripts/verify-store-startup.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Run device identity against PostgreSQL
        run: npx tsx scripts/verify-device-identity.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

  auth-keycloak:
    name: Sign-in (Keycloak)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Keycloak
        run: |
          docker run -d --name keycloak \
            -p 8081:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.0 start-dev

      - name: Configure Keycloak
        run: |
          set -euo pipefail
          KC=http://localhost:8081
          ready=""
          for i in $(seq 1 90); do
            if curl -sf "$KC/realms/master/.well-known/openid-configuration" >/dev/null; then ready=yes; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "Keycloak did not become ready. Its log:"
            docker logs keycloak | tail -50
            exit 1
          fi
          TOKEN=$(curl -sf -X POST "$KC/realms/master/protocol/openid-connect/token" \
            -d "client_id=admin-cli" -d "username=admin" -d "password=admin" -d "grant_type=password" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).access_token))")
          auth="Authorization: Bearer $TOKEN"
          curl -sf -X POST "$KC/admin/realms" -H "$auth" -H "content-type: application/json" \
            -d '{"realm":"system-design","enabled":true}'
          curl -sf -X POST "$KC/admin/realms/system-design/clients" -H "$auth" -H "content-type: application/json" \
            -d '{"clientId":"system-design-store","enabled":true,"protocol":"openid-connect","publicClient":false,
                 "secret":"store-secret","standardFlowEnabled":true,"directAccessGrantsEnabled":false,
                 "redirectUris":["http://127.0.0.1:8090/v1/auth/callback"],"webOrigins":["+"]}'
          curl -sf -X POST "$KC/admin/realms/system-design/users" -H "$auth" -H "content-type: application/json" \
            -d '{"username":"tester","enabled":true,"email":"tester@example.gov","emailVerified":true,
                 "firstName":"Test","lastName":"User","requiredActions":[],
                 "credentials":[{"type":"password","value":"tester-password","temporary":false}]}'
          echo "Keycloak configured."

      - name: Sign in through Keycloak
        run: npx tsx scripts/verify-store-auth-keycloak.ts
        env:
          KEYCLOAK_ISSUER: http://localhost:8081/realms/system-design
          KEYCLOAK_CLIENT_ID: system-design-store
          KEYCLOAK_CLIENT_SECRET: store-secret
          KEYCLOAK_USERNAME: tester
          KEYCLOAK_PASSWORD: tester-password
          AUTH_TEST_PORT: '8090'

      - name: Keycloak log
        if: failure()
        run: docker logs keycloak | tail -100

      - name: Stop Keycloak
        if: always()
        run: docker rm -f keycloak

  # The self-hosting snippets people copy from the documentation. The ones
  # they replaced could not have worked - nginx refused them outright - and
  # nothing checked. verify-selfhost-snippets.ts (in the ordinary suite)
  # holds the files to each other; this runs the real tools on them.
  selfhost-snippets:
    name: Self-hosting snippets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Docker Compose accepts every combination
        run: |
          set -euo pipefail
          cd docs-site/docs/files
          docker compose -f core/compose.yml --env-file core/core.env config -q
          # The secrets are deliberately blank in the example; give them values.
          sed -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=x/' \
              -e 's/^RELAY_TOKEN_SECRET=$/RELAY_TOKEN_SECRET=x/' \
              -e 's/^OIDC_CLIENT_SECRET=$/OIDC_CLIENT_SECRET=x/' \
              workspace/workspace.env > /tmp/workspace.env
          docker compose -f workspace/compose.yml --env-file /tmp/workspace.env config -q
          printf 'KEYCLOAK_ADMIN_PASSWORD=x\nKEYCLOAK_DB_PASSWORD=x\n' >> /tmp/workspace.env
          docker compose -f workspace/compose.yml -f workspace/compose.keycloak.yml --env-file /tmp/workspace.env config -q
          # And refuses to start without a secret, rather than starting open.
          if docker compose -f workspace/compose.yml --env-file workspace/workspace.env config -q 2>/dev/null; then
            echo "compose accepted a workspace deployment with no secrets set"; exit 1
          fi

      - name: nginx accepts both configurations
        run: |
          set -euo pipefail
          mkdir -p /tmp/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/certs/privkey.pem -out /tmp/certs/fullchain.pem -subj /CN=test 2>/dev/null
          for path in core workspace; do
            echo "== $path"
            docker run --rm \
              --add-host editor:127.0.0.1 --add-host relay:127.0.0.1 --add-host store:127.0.0.1 \
              -v "$PWD/docs-site/docs/files/$path/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
              -v /tmp/certs:/etc/nginx/certs:ro \
              nginx:alpine nginx -t
          done
