name: Test

on:
  push:
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run tests

  # WS13-R13: the file-saving and session-safety suite in Firefox, which has no
  # File System Access API. The file-backed sections report as skipped there;
  # timed copies, capability messaging, the interrupted-write check and the
  # leave guard run against Firefox's real behavior.
  file-saving-firefox:
    name: File saving suite (Firefox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Run the suite in Firefox
        run: npx tsx scripts/verify-file-saving.ts
        env:
          E2E_BROWSER: firefox

  # WS8-R16/R17: the store contract against a real PostgreSQL, and the size
  # and latency table the storage decision rests on (OQ-17). The suite also
  # runs in-memory in the main job; both must pass the same checks.
  store-contract-postgres:
    name: Store contract (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: store
          POSTGRES_USER: store
          POSTGRES_DB: store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the store contract against PostgreSQL
        run: npx tsx scripts/verify-store-contract.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Run the store HTTP contract against PostgreSQL
        run: npx tsx scripts/verify-store-http.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Run device enrollment against PostgreSQL
        run: npx tsx scripts/verify-store-devices.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Run retention and legal hold against PostgreSQL
        run: npx tsx scripts/verify-store-retention.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Run the workspace index against PostgreSQL
        run: npx tsx scripts/verify-store-index.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Run the store client against PostgreSQL
        run: npx tsx scripts/verify-store-client.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Sessions against PostgreSQL
        run: npx tsx scripts/verify-sessions.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Rotate a workspace key against PostgreSQL
        run: npx tsx scripts/verify-workspace-rotation.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Start the store as a process against PostgreSQL
        run: npx tsx scripts/verify-store-startup.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

      - name: Run device identity against PostgreSQL
        run: npx tsx scripts/verify-device-identity.ts
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/store

  # WS10-R1, OQ-18: sign-in against a real Keycloak, which is what a
  # government deployment will use. The in-process provider in
  # verify-store-auth.ts covers the protocol logic; this covers the
  # assumptions - discovery, a real login page, a real token.
  #
  # Keycloak runs as a step rather than a service container: a service
  # container cannot be given a command, and this image needs "start-dev" -
  # without it the container exits at once and the job fails before it
  # begins, which is exactly what happened the first time.
  auth-keycloak:
    name: Sign-in (Keycloak)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Keycloak
        run: |
          docker run -d --name keycloak \
            -p 8081:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.0 start-dev

      # A realm, a confidential client for the store, and one person to sign
      # in as. Created through the admin API rather than an imported file, so
      # nothing has to be mounted into the container.
      - name: Configure Keycloak
        run: |
          set -euo pipefail
          KC=http://localhost:8081
          ready=""
          for i in $(seq 1 90); do
            if curl -sf "$KC/realms/master/.well-known/openid-configuration" >/dev/null; then ready=yes; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "Keycloak did not become ready. Its log:"
            docker logs keycloak | tail -50
            exit 1
          fi
          TOKEN=$(curl -sf -X POST "$KC/realms/master/protocol/openid-connect/token" \
            -d "client_id=admin-cli" -d "username=admin" -d "password=admin" -d "grant_type=password" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).access_token))")
          auth="Authorization: Bearer $TOKEN"
          curl -sf -X POST "$KC/admin/realms" -H "$auth" -H "content-type: application/json" \
            -d '{"realm":"system-design","enabled":true}'
          curl -sf -X POST "$KC/admin/realms/system-design/clients" -H "$auth" -H "content-type: application/json" \
            -d '{"clientId":"system-design-store","enabled":true,"protocol":"openid-connect","publicClient":false,
                 "secret":"store-secret","standardFlowEnabled":true,"directAccessGrantsEnabled":false,
                 "redirectUris":["http://127.0.0.1:8090/v1/auth/callback"],"webOrigins":["+"]}'
          curl -sf -X POST "$KC/admin/realms/system-design/users" -H "$auth" -H "content-type: application/json" \
            -d '{"username":"tester","enabled":true,"emailVerified":true,"firstName":"Test","lastName":"User",
                 "credentials":[{"type":"password","value":"tester-password","temporary":false}]}'
          echo "Keycloak configured."

      - name: Sign in through Keycloak
        run: npx tsx scripts/verify-store-auth-keycloak.ts
        env:
          KEYCLOAK_ISSUER: http://localhost:8081/realms/system-design
          KEYCLOAK_CLIENT_ID: system-design-store
          KEYCLOAK_CLIENT_SECRET: store-secret
          KEYCLOAK_USERNAME: tester
          KEYCLOAK_PASSWORD: tester-password
          AUTH_TEST_PORT: "8090"

      - name: Keycloak log
        if: failure()
        run: docker logs keycloak | tail -100

      - name: Stop Keycloak
        if: always()
        run: docker rm -f keycloak
