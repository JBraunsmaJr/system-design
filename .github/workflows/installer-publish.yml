name: Build and publish installer

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: installer

jobs:
  test:
    name: Test the installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: installer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Every example manifest is rendered and the output checked by the
      # tools that will read it: compose, Caddy and nginx.
      - name: Install Caddy and nginx for validation
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nginx-core >/dev/null
          curl -sSL https://github.com/caddyserver/caddy/releases/download/v2.11.2/caddy_2.11.2_linux_amd64.tar.gz | tar -xz -C /tmp caddy
          /tmp/caddy version

      - name: Validate rendered configuration
        run: |
          sudo -E env "PATH=$PATH" COMPOSE="docker compose" CADDY=/tmp/caddy NGINX=nginx sh test/validate-rendered.sh

      # Install, upgrade, a failing upgrade's automatic rollback, manual
      # rollback, adoption, and replacing an existing Caddy stack with a
      # shared one, against a fake docker that forwards `compose config` to
      # the real plugin and Caddyfile validation to the real caddy.
      - name: End-to-end lifecycle
        run: |
          export REAL_CADDY=/tmp/caddy
          export REAL_COMPOSE="$(docker info --format '{{range .ClientInfo.Plugins}}{{if eq .Name "compose"}}{{.Path}}{{end}}{{end}}')"
          node --test test/e2e.test.ts

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image name and date tag
        id: vars
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-installer"
          DATE_TAG="$(date -u +'%Y-%m-%d')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$DATE_TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.release.prerelease }}" != "true" ]; then
            echo "$IMAGE:latest" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build for a start-up check
        uses: docker/build-push-action@v7
        with:
          context: installer
          file: docker/installer/Dockerfile
          load: true
          tags: installer-under-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The built image must reach the daemon, see its install directory at
      # the same path, and pass its own checks.
      - name: The built image runs doctor
        run: |
          mkdir -p /tmp/sd-install
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/sd-install:/tmp/sd-install -w /tmp/sd-install \
            installer-under-test:latest doctor --non-interactive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: installer
          file: docker/installer/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
