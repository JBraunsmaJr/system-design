# TLS termination for the Engineers Notebook, with workspaces.
# Mounted into the proxy container as /etc/nginx/conf.d/default.conf.

# WebSocket upgrades for the relay.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP only redirects.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Your certificate and key, in ./certs beside this file.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # The relay. The trailing slashes strip /relay/ before it reaches the
    # relay, so /relay/health is the relay's /health. This matches RELAY in
    # compose.yml (wss://<domain>/relay/).
    location /relay/ {
        # If the "relay" name does not resolve on your host, use the host
        # machine's IP address in its place.
        proxy_pass http://relay:4444/;
        # WebSockets need HTTP/1.1 to the upstream; without this line the
        # upgrade is dropped and live sessions never connect.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # Sessions stay open while people work; don't cut them off.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The workspace store. /store/v1/... reaches the store as /v1/....
    location /store/ {
        # If the "store" name does not resolve on your host, use the host
        # machine's IP address in its place.
        proxy_pass http://store:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Document updates are uploaded in pieces of up to 8 MB.
        client_max_body_size 16m;
    }

    # Keycloak, only if you run it here (compose.keycloak.yml). The address
    # is in a variable so nginx looks the name up when a request arrives,
    # through Docker's own DNS at 127.0.0.11. Written as a plain
    # "proxy_pass http://keycloak:8080;" nginx would look it up at start
    # and refuse to start at all when Keycloak is not part of the
    # deployment (Option A).
    #
    # Keycloak listens on 8080 and serves under /auth itself
    # (KC_HTTP_RELATIVE_PATH in compose.keycloak.yml), so the path is passed
    # through unchanged.
    location /auth/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keycloak's sign-in responses carry large headers.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # The editor, and its documentation at /docs/. It is served at the root:
    # APP_URL and AFTER_LOGIN_URL in compose.yml are https://<domain>/. To
    # serve it under a prefix instead, change this location and those two
    # values together.
    location / {
        # If the "editor" name does not resolve on your host, use the host
        # machine's IP address in its place.
        proxy_pass http://editor:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
