<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var path = window.location.pathname;
        if (
          path === '/system-design/docs' ||
          path === '/system-design/docs/' ||
          path === '/docs' ||
          path === '/docs/' ||
          path.endsWith('/docs') ||
          path.endsWith('/docs/')
        ) {
          var target = path.replace(/\/docs\/?$/, '/docs/index.html');
          window.location.replace(target + window.location.search + window.location.hash);
        } else {
          var fallback = path.startsWith('/system-design') ? '/system-design/' : '/';
          window.location.replace(fallback);
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="./docs/index.html">documentation</a>...</p>
  </body>
</html>
